    --blue: #38bdf8;
    --orange: #f59e0b;
    --red: #ef4444;

  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);

  }

  header {
    padding: 28px 18px 16px;
    text-align: center;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(30px, 5vw, 50px);
    letter-spacing: -1px;
  }


  .creator {
    margin: 4px 0 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .2px;
  }

  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
  }

  .searchbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(11, 11, 15, .96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 13px 18px;
  }

  .search-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }

  input, button {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    padding: 14px 15px;
    font-size: 16px;
    outline: none;
  }

  input {
    width: 100%;
  }

  input:focus {
    border-color: var(--teal2);
    box-shadow: 0 0 0 3px rgba(20, 184, 166, .18);
  }

  input::placeholder {
    color: #7d7d88;
  }

  button {
    cursor: pointer;
    font-weight: 900;
    white-space: nowrap;
  }

  button:hover {
    border-color: var(--teal2);
  }

  main {
    padding: 20px 18px 60px;
  }

  .status {
    margin: 0 0 14px;
    color: var(--muted);
    font-weight: 800;
  }

  .accordion {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    overflow: hidden;
    margin: 12px 0;
  }

  summary {
    list-style: none;
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    background: var(--teal);
    padding: 16px 18px;
    font-weight: 900;
    text-transform: uppercase;
  }

  summary::-webkit-details-marker {
    display: none;
  }

  summary::after {
    content: "▼";
    margin-left: 6px;
    transition: transform .2s ease;
  }

  details[open] summary::after {
    transform: rotate(180deg);
  }

  .section-count {
    margin-left: auto;
    color: #ccfbf1;
    font-size: 13px;
    white-space: nowrap;
  }

  .section-body {
    padding: 10px;
    background: #0e0e14;
  }

  .charge-card {
    padding: 12px 14px;
    margin: 8px 0;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .charge-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .severity {
    font-size: 11px;
    font-weight: 950;
    letter-spacing: .04em;
  }

  .infraction {
    color: var(--blue);
  }

  .misdemeanor {
    color: var(--orange);
  }

  .felony {
    color: var(--red);
  }

  .capital {
    color: var(--green);
  }

  .charge-title {
    font-size: 16px;
    line-height: 1.22;
    font-weight: 950;
    color: var(--text);
  }

  .no-results {
    display: none;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    padding: 18px;
    color: var(--muted);
    font-weight: 900;
  }

  @media (max-width: 760px) {
    .search-row {
      grid-template-columns: 1fr auto;
    }

    summary {
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .section-count {
      margin-left: 0;
      width: 100%;
    }
  }
</style>
</head>

const searchInput = document.getElementById('searchInput');
const clearButton = document.getElementById('clearButton');
const statusLine = document.getElementById('statusLine');
const accordions = document.getElementById('accordions');
const noResults = document.querySelector('.no-results');

let allCards = [];

// Render all charges
function renderCharges() {
  accordions.innerHTML = '';
  chargesData.forEach(section => {
    const details = document.createElement('details');
    details.className = 'accordion';
    
    const summary = document.createElement('summary');
    summary.innerHTML = `<span>${section.category}</span><span class="section-count">${section.cards.length} charges</span>`;
    details.appendChild(summary);
    
    const sectionBody = document.createElement('div');
    sectionBody.className = 'section-body';
    
    section.cards.forEach(card => {
      const article = document.createElement('article');
      article.className = 'charge-card';
      const searchText = `${card.code} ${card.title} ${card.type} ${section.category}`;
      article.setAttribute('data-search', searchText);
      
      article.innerHTML = `
        <div class="charge-top">
          <span class="severity ${card.type.toLowerCase()}">${card.severity}</span>
        </div>
        <div class="charge-title">${card.code}. ${card.title}</div>
      `;
      
      sectionBody.appendChild(article);
      allCards.push(article);
    });
    
    details.appendChild(sectionBody);
    accordions.appendChild(details);
  });
}

function filterCards() {
  const query = searchInput.value.toLowerCase();
  let visibleCount = 0;

  allCards.forEach(card => {
    const searchText = card.getAttribute('data-search').toLowerCase();
    if (query === '' || searchText.includes(query)) {
      card.style.display = 'block';
      visibleCount++;
    } else {
      card.style.display = 'none';
    }
  });

  if (visibleCount === 0 && query !== '') {
    noResults.style.display = 'block';
    statusLine.textContent = `Showing 0 charge(s) (0 results).`;
  } else {
    noResults.style.display = 'none';
    const total = allCards.length;
    statusLine.textContent = query === '' ? `Showing ${total} total charge(s).` : `Showing ${visibleCount} charge(s) out of ${total} total.`;
  }
}

searchInput.addEventListener('input', filterCards);

clearButton.addEventListener('click', () => {
  searchInput.value = '';
  filterCards();
  searchInput.focus();
});

renderCharges();
filterCards();
</script>
